name: Feature request
description: Propose a focused improvement to Foundation.
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Describe who needs this and the task they are trying to complete.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Include affected profiles, roles or hardware, and any compatibility needs.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
