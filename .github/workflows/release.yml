name: Prepare release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.0)
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require a versioned tag from main
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          sha=$(git rev-parse --verify "refs/tags/$TAG^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          git checkout --detach "$sha"
          python3 scripts/release.py --tag "$TAG" --check
          printf 'sha=%s\ntag=%s\n' "$sha" "$TAG" >> "$GITHUB_OUTPUT"

  checks:
    name: Release validation
    needs: metadata
    uses: ./.github/workflows/check.yml
    with:
      ref: ${{ needs.metadata.outputs.sha }}

  draft:
    name: Create draft release
    needs: [metadata, checks]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Package the validated source
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_SHA: ${{ needs.metadata.outputs.sha }}
        run: |
          test "$(git rev-parse --verify "refs/tags/$TAG^{commit}")" = "$RELEASE_SHA"
          python3 scripts/release.py --tag "$TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          mkdir -p "$RUNNER_TEMP/release-assets"
          git archive --format=tar --prefix="foundation-${TAG#v}/" "$RELEASE_SHA" |
            gzip -n > "$RUNNER_TEMP/release-assets/foundation-$TAG.tar.gz"
          cd "$RUNNER_TEMP/release-assets"
          sha256sum "foundation-$TAG.tar.gz" > SHA256SUMS
      - name: Create or refresh a draft for human publication
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" --json isDraft > "$RUNNER_TEMP/existing-release.json"; then
            jq -e '.isDraft == true' "$RUNNER_TEMP/existing-release.json"
            gh release edit "$TAG" --title "Finito $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
            gh release upload "$TAG" "$RUNNER_TEMP/release-assets/"* --clobber
          else
            gh release create "$TAG" "$RUNNER_TEMP/release-assets/"* \
              --verify-tag --draft --title "Finito $TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
          fi
