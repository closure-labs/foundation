name: CI

on:
  push:
    branches: ['**']
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to validate (defaults to the event commit)
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: Fixtures and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - name: Run fixtures, workflow lint, and release metadata checks
        run: nix develop --no-update-lock-file path:.#ci --command bash tests/ci.sh

  nix:
    name: Nix build and profile evaluation
    needs: fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@527f17dd63d2d60d3e5552934bc84b9a33a14d11 # v3.22.2
      - uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
      - name: Build the default profile and evaluate selectable modules
        run: bash tests/nix-check.sh

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [fixtures, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: test "$FIXTURES_RESULT" = success && test "$NIX_RESULT" = success
