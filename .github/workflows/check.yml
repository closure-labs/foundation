name: CI

on:
  push:
    # Feature changes are validated by pull_request; main validates the merge.
    # Tag preparation still calls this workflow for the exact release source.
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Immutable commit to validate (defaults to the event commit)
        type: string
        required: false
        default: ''
      full:
        description: Require full validation regardless of changed paths
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  checks: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixtures:
    name: Fixtures and workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      plan: ${{ steps.plan.outputs.plan }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
      - name: Plan affected Nix checks
        id: plan
        env:
          CI_FULL: ${{ inputs.full || inputs.ref != '' }}
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_plan.py plan
      - name: Run fixtures, workflow lint, and release metadata checks
        run: nix develop --no-update-lock-file path:.#ci --command bash tests/ci.sh

  nix:
    name: Nix build and profile evaluation
    needs: fixtures
    if: needs.fixtures.result == 'success' && needs.fixtures.outputs.mode != 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@e847f25223456b3058e12f7fc9d777b6a6f25060 # v3.23.2
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Build the default profile and evaluate selectable modules
        env:
          CI_PLAN: ${{ needs.fixtures.outputs.plan }}
        run: bash tests/nix-check.sh --ci

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [fixtures, nix]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Require every check to pass
        env:
          CI_PLAN: ${{ needs.fixtures.outputs.plan }}
          CI_FULL: ${{ inputs.full || inputs.ref != '' }}
          FIXTURES_RESULT: ${{ needs.fixtures.result }}
          NIX_RESULT: ${{ needs.nix.result }}
        run: python3 scripts/ci_plan.py gate
