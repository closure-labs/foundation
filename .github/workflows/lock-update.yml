name: Update Nix dependencies

on:
  schedule:
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-nix-dependencies
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@f296148a827001a9a82d3685b53210c06e5d3b67 # v3.24.0
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Refresh dependency pins
        run: python3 scripts/update-locks.py
      - name: Validate the proposed dependency pins
        run: |
          nix develop --no-update-lock-file path:.#ci --command bash tests/ci.sh
          bash tests/nix-check.sh
      - name: Open a reviewed dependency update
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: |
            flake.nix
            flake.lock
            modules/
            docs/ARCHITECTURE.md
          branch: automation/flake-lock
          delete-branch: true
          commit-message: 'chore(deps): update Nix flake inputs'
          title: 'chore(deps): update Nix flake inputs'
          body: |
            Refreshes flake.lock after fixture checks, workflow lint, default-profile
            build, and selectable-profile evaluation pass with the new pins.

            Review the input revisions and approve any GitHub-required workflow
            runs before merging. This workflow never merges its own PR.
