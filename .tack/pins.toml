# Tack pins are resolved by flake.nix. Update sources with tack update <group>.
[tack]
recomposable = true

[inputs.core.den]
url = "github:denful/den"

[inputs.core.gen]
url = "github:sini/gen/da9d09146df822f7d67ee6843475e471534cf041"
follows = { nixpkgs = "nixpkgs" }

[inputs.core.determinate]
url = "https://flakehub.com/f/DeterminateSystems/determinate/3"

[inputs.core.flake-parts]
url = "https://flakehub.com/f/hercules-ci/flake-parts/0.1"
follows = { nixpkgs-lib = "determinate/nix/nixpkgs" }

[inputs.core.home-manager]
url = "https://flakehub.com/f/nix-community/home-manager/0.2605"
follows = { nixpkgs = "nixpkgs" }

[inputs.core.import-tree]
url = "github:denful/import-tree/a164a12202f58eb67559bd33b5592f20660d9baf"

[inputs.core.nixpkgs]
url = "https://flakehub.com/f/DeterminateSystems/nixpkgs-26.05-chilled/0.1"

[inputs.core.nixpkgs-weekly]
url = "https://flakehub.com/f/DeterminateSystems/nixpkgs-weekly/0.1"

[inputs.development.devenv]
url = "github:cachix/devenv/v2.2.2"

[inputs.development.nixpkgs-unstable]
url = "github:NixOS/nixpkgs/nixpkgs-unstable"

[inputs.desktop-integration.nix-flatpak]
url = "github:gmodena/nix-flatpak"

[inputs.desktop-integration.nixGL]
url = "github:nix-community/nixGL"
