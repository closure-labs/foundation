[inputs.ai.claude-desktop]
url = "github:aaddrick/claude-desktop-debian"
follows = { nixpkgs = "nixpkgs-weekly" }

[inputs.ai.codex-cli-nix]
url = "github:sadjow/codex-cli-nix"

[inputs.ai.claude-code]
url = "github:ryoppippi/nix-claude-code"

[inputs.tooling.tack-tool]
url = "github:manic-systems/tack/673997981720feebb3870645932b6cfe6657db9f"
